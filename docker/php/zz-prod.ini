; Production-only PHP overrides.
;
; Loaded from conf.d with a "zz-" prefix so it sorts LAST and wins over the base
; image's own conf.d files (notably its Xdebug config, which conf.d ordering
; would otherwise apply after the mounted main php.ini). Baked into the image by
; the Dockerfile; NOT used by the dev `php` service, which runs the base image
; directly and mounts zz-opcache-dev.ini instead.

; --- Xdebug: neutralise in prod ---------------------------------------------
; The base image ships Xdebug compiled in, so removing its ini isn't always
; enough. mode=off makes the extension inert (~zero runtime overhead).
xdebug.mode=off

; --- OPcache preloading ------------------------------------------------------
; config/preload.php require()s the compiled prod container preload file (it is
; file_exists-guarded, so it safely no-ops where that cache is absent).
; FPM master runs as root, so preload_user must name the non-root pool user
; (www-data) or PHP refuses to start when preloading is enabled as root.
opcache.preload=/app/config/preload.php
opcache.preload_user=www-data

; --- Filesystem realpath cache ----------------------------------------------
; Safe to grow/lengthen because opcache.validate_timestamps=0 in prod.
realpath_cache_size=16M
realpath_cache_ttl=600
