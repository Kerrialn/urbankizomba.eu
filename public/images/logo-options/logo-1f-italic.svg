<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Italic UK, angular cut: chamfered U, straight-cut K, no rounding.
       The K is clipped to the U's height so both letters share top and
       baseline. -->
  <defs>
    <clipPath id="uheight"><rect x="0" y="18" width="64" height="25.5"/></clipPath>
  </defs>
  <circle cx="32" cy="32" r="32" fill="#4c1d95"/>
  <g transform="translate(32,32) skewX(-12) translate(-34,-32)" stroke="#ffffff" stroke-width="7" stroke-linecap="butt" stroke-linejoin="miter" fill="none">
    <!-- U with a chamfered bottom: outer edges y=18 to y=43.5 -->
    <path d="M15,18 v17 l5,5 h8 l5,-5 v-17"/>
    <!-- K, cut to the same height -->
    <g clip-path="url(#uheight)">
      <line x1="33" y1="33" x2="33" y2="48"/>
      <path d="M33.5,33 L52,14.5"/>
      <path d="M33.5,33 L52,51.5"/>
    </g>
  </g>
</svg>
