<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Italic UK, angular cut: chamfered U, straight-cut K, no round ends. -->
  <circle cx="32" cy="32" r="32" fill="#4c1d95"/>
  <g transform="translate(32,32) skewX(-12) translate(-34,-32)" stroke="#ffffff" stroke-width="7" stroke-linecap="butt" stroke-linejoin="miter" fill="none">
    <!-- U with a chamfered bottom -->
    <path d="M15,18 v17 l5,5 h8 l5,-5 v-17"/>
    <!-- K: the U's right stem continues, two straight arms -->
    <line x1="33" y1="33" x2="33" y2="46"/>
    <path d="M33.5,33 L49,17.5"/>
    <path d="M33.5,33 L49,48.5"/>
  </g>
</svg>
