<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- concrete grain on the ground -->
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="1.3" numOctaves="2" seed="7" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="table" tableValues="0 0.32"/></feComponentTransfer>
      <feComposite in2="SourceGraphic" operator="in"/>
    </filter>
    <!-- rough, sprayed edges plus a faint overspray halo -->
    <filter id="spray" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.5" numOctaves="1" seed="3" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.1" xChannelSelector="R" yChannelSelector="G" result="rough"/>
      <feGaussianBlur in="rough" stdDeviation="0.7" result="halo"/>
      <feComponentTransfer in="halo" result="halo2"><feFuncA type="linear" slope="0.45"/></feComponentTransfer>
      <feMerge><feMergeNode in="halo2"/><feMergeNode in="rough"/></feMerge>
    </filter>
    <clipPath id="disc"><circle cx="32" cy="32" r="32"/></clipPath>
    <!-- the stencil: letters in white, bridges cut out in black -->
    <mask id="uk" maskUnits="userSpaceOnUse" x="0" y="0" width="64" height="64">
      <g transform="translate(32,32) scale(0.92) translate(-32,-32)" stroke="#ffffff" stroke-width="9" stroke-linecap="butt" fill="none">
        <path d="M15,18 v15 a9,9 0 0 0 18,0 v-15"/>
        <line x1="33" y1="33" x2="33" y2="47"/>
        <line x1="31" y1="36" x2="49" y2="18"/>
        <line x1="31" y1="30" x2="49" y2="48"/>
        <!-- drip off the U -->
        <path d="M22,42 q0.6,4 0,7.5" stroke-width="2.2" stroke-linecap="round"/>
      </g>
      <g transform="translate(32,32) scale(0.92) translate(-32,-32)" stroke="#000000" stroke-width="1.4">
        <line x1="9" y1="27" x2="21" y2="27"/>
        <line x1="27" y1="24" x2="39" y2="24"/>
        <line x1="27" y1="41" x2="39" y2="41"/>
        <line x1="39" y1="20" x2="49" y2="30"/>
        <line x1="39" y1="46" x2="49" y2="36"/>
      </g>
    </mask>
  </defs>

  <circle cx="32" cy="32" r="32" fill="#1c1917"/>
  <rect width="64" height="64" fill="#57534e" clip-path="url(#disc)" filter="url(#grain)"/>
  <rect width="64" height="64" fill="#fafaf9" mask="url(#uk)" filter="url(#spray)" clip-path="url(#disc)"/>
</svg>
